name: wolfcord-release

# Builds the native client, not the shell. Separate artifact and separate tag
# namespace (wolfcord-v*) so the two products do not collide in Releases.
on:
  push:
    tags: ["wolfcord-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-b

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate cache key: this branch builds a different workspace.
          key: wolfcord
          workspaces: ". -> target"

      - name: Build
        shell: pwsh
        run: |
          # Debug info off: the `ring` crate fails with cl.exe D8050 otherwise.
          $env:CARGO_PROFILE_RELEASE_DEBUG = "0"
          cargo build --release -p wolfcord-app --locked
          if (-not (Test-Path ".\target\release\wolfcord.exe")) { throw "binary missing" }

      - name: Smoke test
        shell: pwsh
        run: |
          # The runner has no interactive desktop, so the windowed app cannot
          # actually open a window (exit code 1 from winit). Verify what CI can
          # verify: the binary starts, links, and reaches the point where it
          # either opens a window or reports why it cannot.
          $exe = (Resolve-Path ".\target\release\wolfcord.exe").Path
          $out = Join-Path (Get-Location) "smoke.log"
          $p = Start-Process -FilePath $exe -RedirectStandardError $out -PassThru
          Start-Sleep -Seconds 6
          $exited = $p.HasExited
          if (-not $exited) { Stop-Process -Id $p.Id -Force }
          $log = Get-Content $out -ErrorAction SilentlyContinue
          $log | Write-Host

          # A clean run on a desktop prints the offline warning and stays up.
          # A headless run prints a window/display error. Anything else, or an
          # empty log with an immediate exit, is a real failure.
          $sawOffline = $log -match 'WOLFCORD_TOKEN not set'
          if ($sawOffline) {
              if ($exited) { throw "exited despite starting in offline view" }
              Write-Host "OK: offline view, process stayed up"
          } elseif ($log.Count -gt 0) {
              Write-Host "OK: exited headless with a diagnostic ($($log[0]))"
          } else {
              throw "process exited with no output at all"
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\wolfcord.exe dist\
          Copy-Item LICENSE dist\
          Copy-Item crates\wolfcord-app\README.md dist\README.md
          Compress-Archive -Path dist\* -DestinationPath wolfcord-windows-x64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/wolfcord-v')
        uses: softprops/action-gh-release@v2
        with:
          files: wolfcord-windows-x64.zip
          body_path: crates/wolfcord-app/RELEASE_NOTES.md
