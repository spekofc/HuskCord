name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release
        run: cargo build --release --locked

      - name: Smoke test binary
        shell: pwsh
        run: |
          # The shell opens a window and connects to discord.com; in CI there is
          # no interactive desktop, so we only verify the binary starts, prints
          # its startup lines, and does not crash within a few seconds.
          $exe = ".\target\release\huskcord.exe"
          if (-not (Test-Path $exe)) { throw "binary missing" }
          $proc = Start-Process -FilePath $exe `
            -ArgumentList '--data-dir', ".\ci-profile", '--no-tray' `
            -RedirectStandardError ".\err.log" -PassThru
          Start-Sleep -Seconds 12
          $alive = -not $proc.HasExited
          if ($proc.HasExited -eq $false) { $proc.Kill() }
          Get-Content ".\err.log" -ErrorAction SilentlyContinue | Write-Host
          if (-not $alive) { throw "huskcord exited early" }
          Write-Host "shell stayed up"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\huskcord.exe dist\
          Copy-Item LICENSE, README.md dist\
          Compress-Archive -Path dist\* -DestinationPath huskcord-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: huskcord-windows-x64
          path: huskcord-windows-x64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: huskcord-windows-x64.zip
          generate_release_notes: true
          body: |
            ## Huskcord ${{ github.ref_name }}

            Native shell for Discord's web app. Windows x64.

            **Requires the WebView2 runtime** (present on Windows 10/11 by default).

            ### Run
            ```
            huskcord-windows-x64.zip  ->  huskcord.exe
            ```

            ```
            huskcord                      %APPDATA%\Huskcord
            huskcord --profile work       separate session
            huskcord --portable           ./data next to the exe
            huskcord --data-dir <path>    explicit
            ```

            ### What is new in 0.2.0
            - Persistent session across restarts
            - System tray icon with show / mute / quit
            - OS notifications instead of browser notifications
            - Rich Presence over Discord's local IPC pipe
            - Branded exe and window icon
