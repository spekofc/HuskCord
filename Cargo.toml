[workspace]
resolver = "2"
members = ["crates/wolfcord-core", "crates/wolfcord-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/spekofc/HuskCord"

[workspace.dependencies]
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# Performance target: startup latency and steady-state RSS. Codegen is worth it
# here because this binary replaces a 600 MB browser.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
